<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          // If forced to desktop, stay on desktop
          if (sessionStorage.getItem('cariearsa_cloud_force') === 'desktop') return;
          var params = new URLSearchParams(window.location.search);
          if (params.get('view') === 'desktop') {
            sessionStorage.setItem('cariearsa_cloud_force', 'desktop');
            return;
          }

          var ua = navigator.userAgent || '';
          var platform = navigator.platform || '';

          // Check if desktop OS
          var isWindows = /Windows NT|Win64|WOW64|Win32/i.test(ua) || platform.indexOf('Win') !== -1;
          var isMac = /Macintosh|MacIntel|MacPPC|Mac68K/i.test(ua) && !/iPhone|iPad|iPod/i.test(ua);
          var isLinuxDesktop = /Linux/i.test(ua) && !/Android/i.test(ua);
          var isCrOS = /CrOS/i.test(ua);
          var isDesktopOS = isWindows || isMac || isLinuxDesktop || isCrOS;

          // If desktop or laptop (wide screen or desktop OS), NEVER redirect to mobile!
          if (isDesktopOS || window.innerWidth >= 1024) {
            return;
          }

          // ONLY redirect genuine mobile phone devices with narrow screens
          var isMobilePhoneUA = /Android.*Mobile|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
          if (isMobilePhoneUA && window.innerWidth < 768) {
            var target = '/cloud/mobile/' + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {}
      })();
    </script>
    <title>CARIEARSA-CLOUD</title>
    <meta name="description" content="CARIEARSA-CLOUD: Sistem penyimpanan cloud berkecepatan tinggi dengan pemutar audio terintegrasi, pratinjau berkas, dan visualisasi penyimpanan modern." />
    <meta property="og:title" content="CARIEARSA-CLOUD" />
    <meta property="og:description" content="CARIEARSA-CLOUD: Sistem penyimpanan cloud berkecepatan tinggi dengan pemutar audio terintegrasi, pratinjau berkas, dan visualisasi penyimpanan modern." />
    <link rel="canonical" href="https://cariearsa.com/cloud/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/cloud.css">
  </head>
  <body id="cloud-body" class="cyber-cloud-body cyber-scanlines overflow-hidden select-none" data-theme="neo-tokyo">
    <div id="app" class="h-screen w-full flex flex-col relative">
      <!-- Drop Overlay -->
      <div id="drop-overlay" class="pointer-events-none absolute inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm border-2 border-dashed border-[var(--c-accent)] m-4 rounded-2xl">
        <div class="flex flex-col items-center justify-center p-8 bg-[var(--c-surface)]/95 border border-[var(--c-accent)] rounded-xl shadow-2xl">
          <i data-lucide="upload-cloud" class="w-10 h-10 text-[var(--c-accent)] mb-3 animate-bounce"></i>
          <p class="text-base font-bold text-[var(--c-text-main)] mb-1">Lepaskan file untuk mengunggah</p>
          <p class="text-xs text-[var(--c-text-muted)] font-mono">CARIEARSA-CLOUD STORAGE</p>
        </div>
      </div>

      <!-- Header (Fixed to screen) -->
      <header class="fixed top-0 left-0 right-0 h-14 bg-[var(--c-surface)]/95 backdrop-blur-md border-b-2 border-[var(--c-border)] flex items-center justify-between px-3 sm:px-5 z-30 gap-2 shadow-md transition-colors">
        <div class="flex items-center gap-2 shrink-0 select-none">
          <a href="/" class="cyber-btn-chamfer cyber-btn-solid-surface px-2.5 py-1 text-[11px] font-mono font-bold flex items-center gap-1 hover:border-[var(--c-accent)] transition-all" title="Kembali ke Portofolio CARIEARSA">
            <span class="text-[var(--c-accent)]">←</span> <span>HUB</span>
          </a>
          <a href="/japan/" class="hidden md:flex cyber-btn-pill cyber-btn-solid-surface px-2.5 py-1 text-[11px] font-mono items-center gap-1 hover:border-[var(--c-secondary)] transition-all" title="Japan Cyber Map">
            <span class="text-[var(--c-secondary)]">🗾</span> JAPAN
          </a>
          <a href="/aniwatch/" class="hidden lg:flex cyber-btn-cut-right cyber-btn-solid-surface px-2.5 py-1 text-[11px] font-mono items-center gap-1 hover:border-red-500 transition-all" title="AniWatch Streaming">
            <span class="text-red-500">▶</span> ANIWATCH
          </a>
          <div class="flex items-baseline tracking-wider pl-2 border-l-2 border-[var(--c-border)] ml-1">
            <span class="text-xs sm:text-sm font-black tracking-widest text-[var(--c-text-main)] uppercase" style="font-family: 'Oswald', sans-serif;">CARIEARSA</span>
            <span class="text-xs sm:text-sm font-black text-[var(--c-accent)] drop-shadow-[0_0_8px_var(--c-accent-glow)] uppercase ml-0.5" style="font-family: 'Oswald', sans-serif;">CLOUD</span>
          </div>
        </div>

        <div class="flex-1 max-w-xs mx-1 sm:mx-3 hidden md:block">
          <div class="relative flex items-center">
            <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 text-[var(--c-text-muted)] pointer-events-none"></i>
            <input type="text" id="search-input-desktop" placeholder="Cari berkas..." class="w-full pl-8 pr-7 py-1.5 bg-[var(--c-bg)] border border-[var(--c-border)] focus:border-[var(--c-accent)] focus:ring-1 focus:ring-[var(--c-accent)]/40 rounded-lg text-xs text-[var(--c-text-main)] placeholder-[var(--c-text-muted)]/70 focus:outline-none transition-all font-mono" />
            <button id="clear-search-desktop" type="button" class="absolute right-2 text-[var(--c-text-muted)] hover:text-white hidden p-0.5 rounded transition-colors" title="Hapus pencarian"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
          </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2" id="header-controls">
          <!-- Populated by JS -->
        </div>
      </header>

      <!-- Responsive Mobile Search Drawer -->
      <div id="mobile-search-bar" class="fixed top-14 left-0 right-0 z-20 bg-[var(--c-surface)] border-b-2 border-[var(--c-accent)] px-3 py-2 shadow-2xl backdrop-blur-md hidden transition-all">
        <div class="relative flex items-center max-w-md mx-auto">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 text-[var(--c-accent)] pointer-events-none"></i>
          <input type="text" id="search-input-mobile" placeholder="Cari berkas..." class="w-full pl-9 pr-16 py-2 bg-[var(--c-bg)] border border-[var(--c-border)] focus:border-[var(--c-accent)] rounded-lg text-xs text-[var(--c-text-main)] placeholder-[var(--c-text-muted)] focus:outline-none font-mono" />
          <div class="absolute right-2 flex items-center gap-1.5">
            <button id="clear-search-mobile" type="button" class="text-[var(--c-text-muted)] hover:text-white hidden p-1 rounded transition-colors" title="Hapus"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            <button id="close-mobile-search" type="button" class="px-2 py-0.5 bg-[var(--c-surface-card)] hover:bg-[var(--c-surface-hover)] border border-[var(--c-border)] text-[var(--c-text-muted)] hover:text-white rounded text-xs font-mono font-bold" title="Tutup">✕</button>
          </div>
        </div>
      </div>

      <main class="flex-1 flex overflow-hidden pt-14 h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-52 bg-[var(--c-surface)] border-r border-[var(--c-border)] p-3 flex flex-col gap-3 shrink-0 hidden md:flex transition-colors">
           <!-- Populated by JS -->
        </aside>

        <!-- Workspace -->
        <section class="flex-1 flex flex-col overflow-hidden bg-[var(--c-bg)] p-3 sm:p-4">
          <div id="workspace-header" class="flex items-center justify-between gap-2 mb-2.5">
             <!-- Populated by JS -->
          </div>
          <div id="upload-banner-container"></div>
          
          <!-- File Grid -->
          <div id="file-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2.5 flex-1 overflow-y-auto custom-scrollbar pr-1 pb-24 content-start">
             <!-- Files go here -->
          </div>
        </section>
      </main>

      <!-- Fixed Overlays -->
      <div id="bulk-action-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 max-w-lg w-[92%] sm:w-auto bg-[var(--c-surface)]/95 border border-[var(--c-accent)] rounded-xl p-2 sm:px-4 sm:py-2 shadow-[0_10px_35px_rgba(0,0,0,0.8),0_0_20px_var(--c-accent-glow)] backdrop-blur-md flex items-center justify-between gap-3 text-[var(--c-text-main)] hidden"></div>
      
      <div id="rename-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden"></div>

      <div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden"></div>

      <div id="preview-modal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/85 backdrop-blur-md hidden"></div>

      <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-md hidden"></div>
      
      <div id="audio-player" class="fixed bottom-0 left-0 right-0 bg-[var(--c-surface)]/95 border-t border-[var(--c-border)] backdrop-blur-xl shadow-[0_-10px_30px_rgba(0,0,0,0.7)] z-40 hidden transition-transform duration-300 translate-y-full"></div>
      
      <div id="toast" class="fixed top-4 right-4 z-50 flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-mono shadow-2xl backdrop-blur-md border hidden"></div>
    </div>

    <!-- Hidden global input and audio -->
    <audio id="global-audio" class="hidden"></audio>
    <input type="file" id="hidden-file-input" multiple class="hidden" onchange="handleUploadInput(event)" />

    <script type="module" src="/src/cloud/main.js"></script>
  </body>
</html>
