<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
  <meta name="theme-color" content="#14151a" />
  <meta name="color-scheme" content="light dark" />
  <title>CARIEARSA Note — Minimalist Cloud Note & Markdown Editor</title>
  <meta name="description" content="A fast, minimal online note and scratchpad application for CARIEARSA and fadhil.dev with automatic cloud saving and real-time cross-device sync." />
  <meta name="keywords" content="Online Notes, Cloud Notes, Scratchpad, CARIEARSA Notes, Fadhil Note, Minimalist Markdown" />
  <link rel="canonical" href="https://cariearsa.com/note/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CARIEARSA" />
  <meta property="og:title" content="CARIEARSA Note — Minimalist Cloud Note & Markdown Editor" />
  <meta property="og:description" content="Fast, minimal online note application with automatic cloud saving and cross-device sync." />
  <meta property="og:url" content="https://cariearsa.com/note/" />
  <meta property="og:image" content="https://cariearsa.com/assets/image1.avif" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CARIEARSA Note — Minimalist Cloud Note & Markdown Editor" />
  <meta name="twitter:description" content="Fast, minimal online note application with automatic cloud saving and cross-device sync." />
  <meta name="twitter:image" content="https://cariearsa.com/assets/image1.avif" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "CARIEARSA Note",
    "description": "Minimalist Cloud Note and Editor Application",
    "url": "https://cariearsa.com/note/",
    "applicationCategory": "ProductivityApplication",
    "author": {
      "@type": "Person",
      "name": "Fadhil Akbar Cariearsa"
    }
  }
  </script>
  <link rel="preload" href="/note/styles.css" as="style" />
  <link rel="stylesheet" href="/note/styles.css" />
</head>
<body>
  <main class="note-app" aria-label="Online note">
    <header class="note-bar">
      <a class="brand" href="/" aria-label="Back to Home">fadhil.dev</a>
      <label class="doc-field">
        <span>Doc</span>
        <input id="doc-key" name="doc" type="text" inputmode="latin" autocomplete="off" spellcheck="false" maxlength="32" value="main" aria-label="Document key" />
      </label>
      <output id="save-status" class="status" aria-live="polite">Ready</output>
    </header>
    <section class="editor-shell" aria-label="Note editor">
      <input id="note-title" class="title-input" type="text" maxlength="120" autocomplete="off" spellcheck="true" placeholder="Title" aria-label="Note title" />
      <textarea id="note-body" class="body-input" autocomplete="off" spellcheck="true" placeholder="Write your note…" aria-label="Note body"></textarea>
    </section>
  </main>
  <script type="module" src="/note/app.js"></script>
</body>
</html>
